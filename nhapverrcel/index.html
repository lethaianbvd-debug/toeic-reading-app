<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Thi TOEIC Reading</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-10">
    <div class="flex items-center space-x-3">
      <span class="bg-blue-600 text-white font-bold px-3 py-1 rounded text-sm">TOEIC Reading</span>
<select id="examSelect" class="bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
        <option value="data/test1.json">ETS 2024 - Test 1</option>
        <option value="data/test2.json">ETS 2024 - Test 2</option>
        <option value="data/test3.json">ETS 2024 - Test 3</option>
        <option value="data/test4.json">ETS 2024 - Test 4</option>
        <option value="data/test5.json">ETS 2024 - Test 5</option>
        <option value="data/test6.json">ETS 2024 - Test 6</option>
        <option value="data/test7.json">ETS 2024 - Test 7</option>
        <option value="data/test8.json">ETS 2024 - Test 8</option>
        <option value="data/test9.json">ETS 2024 - Test 9</option>
        <option value="data/test10.json">ETS 2024 - Test 10</option>
      </select>    </div>
    <div class="flex items-center space-x-4">
      <div class="text-sm font-medium text-slate-500">Thời gian còn lại:</div>
      <div id="timer" class="text-xl font-bold font-mono text-red-600 bg-red-50 px-3 py-1 rounded border border-red-200">15:00</div>
      <button id="submitBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded text-sm transition">Nộp bài</button>
    </div>
  </header>

  <!-- Body -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Cột trái: Đoạn văn Part 6 / 7 (Tự động ẩn với Part 5) -->
    <section id="passageCol" class="lg:col-span-6 bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-y-auto max-h-[75vh]">
      <div class="flex items-center space-x-2 mb-4 border-b pb-2">
        <span class="text-xs uppercase tracking-wide font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded">Part 7 Reading</span>
        <span class="text-sm text-slate-500 font-medium">Đoạn văn đọc hiểu</span>
      </div>
      <div id="passageText" class="whitespace-pre-line leading-relaxed text-slate-700 text-sm"></div>
    </section>

    <!-- Cột phải: Câu hỏi & 4 lựa chọn -->
    <section id="questionCol" class="lg:col-span-6 bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center mb-4">
          <span id="partBadge" class="text-xs uppercase tracking-wide font-bold bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded">Part 5</span>
          <span id="questionCounter" class="text-sm text-slate-400 font-medium">Câu 1/4</span>
        </div>

        <p id="questionText" class="text-base font-semibold text-slate-900 mb-6 leading-normal"></p>

        <!-- Danh sách đáp án A, B, C, D -->
        <div id="optionsContainer" class="space-y-3"></div>

        <!-- Khung giải thích chi tiết (Hiện sau khi nộp bài) -->
        <div id="explanationBox" class="mt-6 p-4 rounded-lg bg-blue-50 border border-blue-200 text-sm hidden">
          <div class="font-bold text-blue-900 mb-1">Giải thích chi tiết:</div>
          <div id="explanationText" class="text-blue-800"></div>
        </div>
      </div>

      <!-- Điều hướng Câu trước / Câu sau -->
      <div class="flex justify-between items-center mt-8 pt-4 border-t border-slate-100">
        <button id="prevBtn" class="px-4 py-2 border border-slate-300 rounded font-medium text-sm hover:bg-slate-50 transition">← Câu trước</button>
        <div id="questionPalette" class="flex space-x-2"></div>
        <button id="nextBtn" class="px-4 py-2 bg-blue-600 text-white rounded font-medium text-sm hover:bg-blue-700 transition">Câu tiếp →</button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
