<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AN TOEIC — Luyện Thi TOEIC Thực Chiến</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Tùy chỉnh thanh cuộn đẹp mắt */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 1. Header phong cách Đậu TOEIC -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <div class="flex items-center space-x-2">
          <!-- Thay icon emoji nếu muốn -->
          <span class="w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center font-extrabold text-base shadow-sm">🎯</span>
          <!-- Thay chữ ĐẬU TOEIC thành tên bạn muốn -->
          <span class="font-extrabold text-lg sm:text-xl text-slate-900 tracking-tight">AN <span class="text-emerald-600">TOEIC</span></span>
        </div>
        
        <!-- Dropdown chọn đề -->
        <div class="relative">
          <select id="examSelect" class="bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-semibold text-xs sm:text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer transition">
            <option value="data/test1.json">ETS 2024 - Test 1</option>
            <option value="data/test2.json">ETS 2024 - Test 2</option>
            <option value="data/test3.json">ETS 2024 - Test 3</option>
            <option value="data/test4.json">ETS 2024 - Test 4</option>
            <option value="data/test5.json">ETS 2024 - Test 5</option>
            <option value="data/test6.json">ETS 2024 - Test 6</option>
            <option value="data/test7.json">ETS 2024 - Test 7</option>
            <option value="data/test8.json">ETS 2024 - Test 8</option>
            <option value="data/test9.json">ETS 2024 - Test 9</option>
            <option value="data/test10.json">ETS 2024 - Test 10</option>
            <option value="data22/test1.json">ETS 2022 - Test 1</option>
            <option value="data22/test2.json">ETS 2022 - Test 2</option>
            <option value="data22/test3.json">ETS 2022 - Test 3</option>
            <option value="data22/test4.json">ETS 2022 - Test 4</option>
            <option value="data22/test5.json">ETS 2022 - Test 5</option>
            <option value="data22/test6.json">ETS 2022 - Test 6</option>
            <option value="data22/test7.json">ETS 2022 - Test 7</option>
            <option value="data22/test8.json">ETS 2022 - Test 8</option>
            <option value="data22/test9.json">ETS 2022 - Test 9</option>
            <option value="data22/test10.json">ETS 2022 - Test 10</option>
            <option value="data23/test1.json">ETS 2023 - Test 1</option>
            <option value="data23/test3.json">ETS 2023 - Test 3</option>
            <option value="data23/test5.json">ETS 2023 - Test 5</option>
            <option value="data23/test6.json">ETS 2023 - Test 6</option>
            <option value="data23/test7.json">ETS 2023 - Test 7</option>
            <option value="data23/test8.json">ETS 2023 - Test 8</option>
            <option value="data23/test9.json">ETS 2023 - Test 9</option>
            <option value="data23/test10.json">ETS 2023 - Test 10</option>
            <option value="data21/test1.json">ETS 2021 - Test 1</option>
            <option value="data21/test2.json">ETS 2021 - Test 2</option>
            <option value="data21/test3.json">ETS 2021 - Test 3</option>
            <option value="data21/test4.json">ETS 2021 - Test 4</option>
            <option value="data21/test5.json">ETS 2021 - Test 5</option>
            <option value="data20/test1.json">ETS 2020 - Test 1</option>
            <option value="data20/test2.json">ETS 2020 - Test 2</option>
            <option value="data20/test3.json">ETS 2020 - Test 3</option>
            <option value="data20/test4.json">ETS 2020 - Test 4</option>
            <option value="data20/test5.json">ETS 2020 - Test 5</option>
            <option value="data20/test6.json">ETS 2020 - Test 6</option>
            <option value="data20/test7.json">ETS 2020 - Test 7</option>
            <option value="data20/test8.json">ETS 2020 - Test 8</option>
            <option value="data20/test10.json">ETS 2020 - Test 10</option>
            <option value="data19/test1.json">ETS 2019 - Test 1</option>
            <option value="data19/test2.json">ETS 2019 - Test 2</option>
            <option value="data19/test3.json">ETS 2019 - Test 3</option>
            <option value="data19/test4.json">ETS 2019 - Test 4</option>
            <option value="data19/test5.json">ETS 2019 - Test 5</option>
            <option value="data19/test6.json">ETS 2019 - Test 6</option>
            <option value="data19/test7.json">ETS 2019 - Test 7</option>
            <option value="data19/test8.json">ETS 2019 - Test 8</option>
            <option value="data19/test9.json">ETS 2019 - Test 9</option>
            <option value="data19/test10.json">ETS 2019 - Test 10</option>
            <option value="data25/test1.json">ETS 2025 - Test 1</option>
            <option value="data25/test2.json">ETS 2025 - Test 2</option>
            <option value="data25/test3.json">ETS 2025 - Test 3</option>
            <option value="data25/test4.json">ETS 2025 - Test 4</option>
            <option value="data25/test5.json">ETS 2025 - Test 5</option>
            <option value="data25/test6.json">ETS 2025 - Test 6</option>
            <option value="data25/test7.json">ETS 2025 - Test 7</option>
            <option value="data25/test8.json">ETS 2025 - Test 8</option>
            <option value="data25/test9.json">ETS 2025 - Test 9</option>
            <option value="data25/test10.json">ETS 2025 - Test 10</option>

          </select>
        </div>
      </div>

      <!-- Đồng hồ đếm ngược & Nút nộp bài -->
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-1.5 bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-lg border border-red-100 text-xs sm:text-sm font-mono shadow-xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span id="timer">120:00</span>
        </div>
        <button id="submitBtn" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold text-xs sm:text-sm px-4 py-1.5 rounded-lg transition shadow-sm flex items-center space-x-1.5">
          <span>Nộp bài</span>
        </button>
      </div>

    </div>

    <!-- 2. Thanh lọc Part (Part Filter Tabs) -->
    <div class="border-t border-slate-100 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2 overflow-x-auto flex space-x-1.5 sm:space-x-2 text-xs font-semibold" id="partFilterContainer">
        <button data-part="ALL" class="part-tab-btn px-3 py-1.5 rounded-full bg-emerald-600 text-white transition">Tất cả đề</button>
        <button data-part="Part 1" class="part-tab-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Part 1</button>
        <button data-part="Part 2" class="part-tab-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Part 2</button>
        <button data-part="Part 3" class="part-tab-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Part 3</button>
        <button data-part="Part 4" class="part-tab-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Part 4</button>
        <button data-part="Part 5" class="part-tab-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Part 5</button>
        <button data-part="Part 6" class="part-tab-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Part 6</button>
        <button data-part="Part 7" class="part-tab-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Part 7</button>
      </div>
    </div>
  </header>

  <!-- 3. Khu vực làm bài chính (Split View) -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- Cột trái: Bài đọc / Nghe Audio / Tranh minh họa -->
    <section id="passageCol" class="lg:col-span-6 bg-white rounded-2xl border border-slate-200/80 shadow-xs p-5 sm:p-6 flex flex-col max-h-[75vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        <div class="flex items-center space-x-2">
          <span id="leftBadge" class="text-xs font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-md border border-emerald-100">Listening & Reading</span>
          <span class="text-xs text-slate-400 font-medium">Tài liệu tham khảo</span>
        </div>
      </div>
      
      <!-- Audio & Ảnh sẽ được app.js chèn tự động vào đây -->
      <div id="mediaBox" class="space-y-4 mb-4"></div>
      
      <!-- Văn bản bài đọc -->
      <div id="passageText" class="whitespace-pre-line text-sm leading-relaxed text-slate-700 font-normal"></div>
    </section>

    <!-- Cột phải: Câu hỏi & 4 lựa chọn A/B/C/D -->
    <section id="questionCol" class="lg:col-span-6 bg-white rounded-2xl border border-slate-200/80 shadow-xs p-5 sm:p-6 flex flex-col justify-between min-h-[500px]">
      <div>
        <!-- Thông tin số câu & Phím tắt nhắc nhở -->
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
          <div class="flex items-center space-x-2">
            <span id="partBadge" class="text-xs font-bold uppercase tracking-wider bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md border border-blue-100">Part 1</span>
            <span id="questionCounter" class="text-xs font-semibold text-slate-500">Câu 1/200</span>
          </div>
          <span class="text-[11px] text-slate-400 font-medium hidden sm:inline">Phím tắt: <kbd class="px-1.5 py-0.5 bg-slate-100 rounded border border-slate-200 font-mono text-[10px]">A</kbd> <kbd class="px-1.5 py-0.5 bg-slate-100 rounded border border-slate-200 font-mono text-[10px]">B</kbd> <kbd class="px-1.5 py-0.5 bg-slate-100 rounded border border-slate-200 font-mono text-[10px]">C</kbd> <kbd class="px-1.5 py-0.5 bg-slate-100 rounded border border-slate-200 font-mono text-[10px]">D</kbd></span>
        </div>

        <!-- Nội dung câu hỏi -->
        <h2 id="questionText" class="text-base sm:text-lg font-bold text-slate-900 mb-6 leading-relaxed"></h2>

        <!-- Khung 4 lựa chọn -->
        <div id="optionsContainer" class="space-y-3"></div>

        <!-- Khung giải thích chi tiết chuẩn Đậu English (Hiện sau khi nộp bài) -->
        <div id="explanationBox" class="mt-6 p-4 sm:p-5 rounded-xl bg-slate-50 border border-slate-200 text-sm hidden">
          <div class="flex items-center space-x-2 text-emerald-800 font-bold mb-3">
            <span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs">💡</span>
            <span>PHÂN TÍCH & GIẢI THÍCH CHI TIẾT</span>
          </div>
          <div id="explanationText" class="text-slate-700 whitespace-pre-line leading-relaxed text-xs sm:text-sm"></div>
        </div>
      </div>

      <!-- Nút điều hướng chuyển câu -->
      <div class="flex items-center justify-between mt-8 pt-4 border-t border-slate-100">
        <button id="prevBtn" class="px-4 py-2 border border-slate-200 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-50 active:scale-95 transition disabled:opacity-40 disabled:pointer-events-none flex items-center space-x-1">
          <span>← Câu trước</span>
        </button>
        <button id="nextBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl text-xs sm:text-sm font-semibold transition flex items-center space-x-1 shadow-sm">
          <span>Câu tiếp theo →</span>
        </button>
      </div>
    </section>

  </main>

  <!-- 4. Thanh bảng câu hỏi cố định dưới đáy (Question Palette Bar) -->
  <footer class="bg-white border-t border-slate-200 py-3 sticky bottom-0 z-20 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between gap-4">
      <div class="text-xs font-semibold text-slate-500 shrink-0 hidden sm:block">Danh sách câu:</div>
      <div id="questionPalette" class="flex space-x-1.5 overflow-x-auto py-1 px-1 flex-1"></div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
